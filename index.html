<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Event Playground</title>
    <link rel="stylesheet" href="c.css">
</head>
<body>

    <h1>الوظيفة السادسة: Interactive Event Playground</h1>

    <div class="section">
        <h2>1. الأزرار (Buttons)</h2>
        <button id="btnColor">تغيير اللون</button>
        <button id="btnMessage">إظهار رسالة</button>
        <button id="btnCounter">العداد: <span id="countVal">0</span></button>
        <p id="msgDisplay" style="min-height: 20px; margin-top: 15px; font-style: italic;"></p>
    </div>

    <div class="section">
        <h2>2. أحداث الإدخال (Input Events)</h2>
        <input type="text" id="textInput" placeholder="اكتب أي شيء هنا...">
        <p>النص المباشر: <span id="liveText"></span></p>
        <p>عدد الأحرف: <span id="charCount">0</span></p>
    </div>

    <div class="section">
        <h2>3. أحداث الماوس (Mouse Events)</h2>
        <div id="mouseBox">المحتوى الأصلي</div>
    </div>

    <div class="section">
        <h2>4. أحداث لوحة المفاتيح (Keyboard Events)</h2>
        <p>اضغط على أي زر في لوحة المفاتيح لرؤيته.</p>
        <p>الزر المضغوط: <span id="keyDisplay">لا يوجد</span></p>
    </div>

    <script src="j.js"></script>
</body>
</html>
